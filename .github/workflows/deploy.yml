name: Deploy to AWS EC2

# Faz deploy automaticamente quando algo é merged na main.
# Também pode ser disparado manualmente em Actions → "Deploy to AWS EC2" → "Run workflow".
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-ec2
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy docker-compose stack to EC2
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      EC2_HOST: ${{ secrets.EC2_HOST }}
      EC2_USER: ${{ secrets.EC2_USER }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Validate required secrets
        run: |
          missing=""
          [ -z "$EC2_HOST" ] && missing="$missing EC2_HOST"
          [ -z "$EC2_USER" ] && missing="$missing EC2_USER"
          [ -z "${{ secrets.EC2_SSH_KEY }}" ] && missing="$missing EC2_SSH_KEY"
          if [ -n "$missing" ]; then
            echo "ERROR: missing repo secret(s):$missing"
            echo "Configure them at Settings > Secrets and variables > Actions before this workflow can deploy."
            exit 1
          fi
          echo "Required secrets are present."

      - name: Configure SSH for EC2
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$EC2_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "SSH key written."

      - name: Rsync source to EC2 (preserves .env)
        run: |
          # --delete mantém o diretório remoto em sync, mas preservamos .env
          # e volumes locais do docker via --exclude.
          rsync -az --delete \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='node_modules/' \
            --exclude='dist/' \
            --exclude='.env' \
            --exclude='*.pem' \
            --exclude='mobile/' \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -o ConnectTimeout=10" \
            ./ "$EC2_USER@$EC2_HOST:/home/$EC2_USER/ecamarao/"
          echo "Source synced to EC2."

      - name: Build images and restart docker-compose stack
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -o ConnectTimeout=10 "$EC2_USER@$EC2_HOST" bash -s <<'REMOTE'
          set -euo pipefail
          cd "/home/$USER/ecamarao"

          if [ ! -f .env ]; then
            echo "ERROR: /home/$USER/ecamarao/.env is missing on the EC2."
            echo "Create it manually once (see .env.prod.example) before the first CI deploy."
            exit 1
          fi

          echo "== docker compose build + up -d =="
          sudo docker compose -f docker-compose.prod.yml --env-file .env up -d --build

          echo "== Pruning dangling images =="
          sudo docker image prune -f

          echo "== Current stack status =="
          sudo docker compose -f docker-compose.prod.yml --env-file .env ps
          REMOTE

      - name: Smoke test public endpoint
        run: |
          echo "Waiting a few seconds for containers to settle..."
          sleep 8
          # HTTP-only until a domain + TLS is added (see DEPLOY.md).
          # Retry up to 6 times (~60s) — rebuilds can take a moment to be reachable.
          for i in 1 2 3 4 5 6; do
            code=$(curl -s -o /dev/null -w "%{http_code}" "http://$EC2_HOST/" || true)
            echo "Attempt $i: HTTP $code"
            if [ "$code" = "200" ]; then
              echo "Deploy OK — http://$EC2_HOST/ is responding 200."
              exit 0
            fi
            sleep 10
          done
          echo "Smoke test failed — http://$EC2_HOST/ did not return 200 within 60s."
          exit 1

      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
