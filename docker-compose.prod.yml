services:
  postgres:
    image: postgres:16-alpine
    container_name: ecamarao-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-ecamarao}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      POSTGRES_DB: ${DB_NAME:-ecamarao}
    volumes:
      - ecamarao-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-ecamarao} -d ${DB_NAME:-ecamarao}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ecamarao-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 8000
      CORS_ORIGIN: ${CORS_ORIGIN:-}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-ecamarao}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      DB_NAME: ${DB_NAME:-ecamarao}
      # TypeORM auto-syncs the schema on boot. OK for this MVP because there
      # are no migrations in the repo yet; switch to "false" and introduce
      # proper migrations before this app carries real production data.
      DB_SYNCHRONIZE: ${DB_SYNCHRONIZE:-true}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1d}
      SEED_ADMIN_USERNAME: ${SEED_ADMIN_USERNAME:-admin}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:?SEED_ADMIN_PASSWORD is required}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@ecamarao.local}

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ecamarao-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  ecamarao-pgdata:
