services:
  postgres:
    image: postgres:16-alpine
    container_name: ecamarao-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-ecamarao}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      POSTGRES_DB: ${DB_NAME:-ecamarao}
    volumes:
      - ecamarao-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-ecamarao} -d ${DB_NAME:-ecamarao}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ecamarao-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 8000
      DATABASE_URL: postgresql://${DB_USER:-ecamarao}:${DB_PASSWORD:?DB_PASSWORD is required}@postgres:5432/${DB_NAME:-ecamarao}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      CORS_ORIGIN: ${CORS_ORIGIN:-}

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ecamarao-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  ecamarao-pgdata:
